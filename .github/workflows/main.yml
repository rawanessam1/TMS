name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- BACKEND ----------
      - name: Set up Node.js for Backend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "pern-mcp-starter/backend/package-lock.json" # ✅ correct

      - name: Install Backend Dependencies
        working-directory: ./pern-mcp-starter/backend
        run: npm ci # ✅ correct for CI

      # ---------- FRONTEND ----------
      - name: Set up Node.js for Frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "pern-mcp-starter/frontend/package-lock.json" # ✅ correct

      - name: Install Frontend Dependencies
        working-directory: ./pern-mcp-starter/frontend
        run: npm ci # ✅ correct for CI

      - name: Lint Frontend
        working-directory: ./pern-mcp-starter/frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./pern-mcp-starter/frontend
        run: npm run build

      # ---------- DOCKER ----------
      - name: Validate docker-compose syntax
        working-directory: ./pern-mcp-starter
        run: docker-compose config -q
